<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nivela</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Nivela</h1>
    <p class="sub">Nivelamento automático de fala</p>
  </header>

  <section class="group">
    <label>Loudness alvo
      <select id="target">
        <option value="-14">-14 LUFS (redes sociais)</option>
        <option value="-16">-16 LUFS (podcast, estéreo)</option>
        <option value="-18" selected>-18 LUFS (padrão para fala)</option>
        <option value="-19">-19 LUFS (podcast, mono)</option>
        <option value="-23">-23 LUFS (TV, EBU R128)</option>
        <option value="-24">-24 LUFS (TV, ATSC A/85)</option>
      </select>
    </label>

    <label>Intensidade do nivelamento <output id="strengthOut"></output>
      <input type="range" id="strength" min="0" max="100" step="5" value="100">
    </label>

    <label>Janela de nivelamento <output id="windowOut"></output>
      <input type="range" id="window" min="1" max="10" step="0.5" value="4">
    </label>
    <p class="hint">Janela menor reage mais rápido a mudanças de volume. Janela maior soa mais natural.</p>

    <details>
      <summary>Avançado</summary>
      <label>Reforço máximo <output id="maxBoostOut"></output>
        <input type="range" id="maxBoost" min="3" max="30" step="1" value="20">
      </label>
      <label>Atenuação máxima <output id="maxCutOut"></output>
        <input type="range" id="maxCut" min="3" max="24" step="1" value="12">
      </label>
      <label>Teto de pico <output id="ceilingOut"></output>
        <input type="range" id="ceiling" min="-6" max="0" step="0.5" value="-1">
      </label>
      <label class="check"><input type="checkbox" id="compressor" checked> Compressão leve dos picos</label>
      <label class="check"><input type="checkbox" id="noiseProtect" checked> Não amplificar ruído nas pausas</label>
      <label class="check"><input type="checkbox" id="disableOriginal" checked> Desativar o clipe original (não apaga)</label>
      <label>ffmpeg
        <input type="text" id="ffmpeg" spellcheck="false" placeholder="caminho do ffmpeg.exe">
      </label>
    </details>
  </section>

  <section class="actions">
    <button id="btnSel" class="primary">Nivelar clipes selecionados</button>
    <button id="btnFile">Nivelar arquivo...</button>
    <button id="btnCancel" class="danger" hidden>Cancelar</button>
  </section>

  <section class="status">
    <div class="bar"><div id="barFill"></div></div>
    <div id="stage" class="stage">Pronto.</div>
    <pre id="log"></pre>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
